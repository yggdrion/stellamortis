# Player host (PLAN §4.7): the lobby that hands out room codes and relays WebRTC signaling,
# and coturn for STUN plus a TURN relay. Runs from a clone of this repo on the gvm host. gvm's
# Caddy terminates TLS for lobby.r4b2.de and reaches the lobby over gvm's network. Setup:
# README.md. For a local test without gvm: docker-compose.local.yml.
name: stellamortis-lobby

services:
  lobby:
    build: ../../lobby
    environment:
      TURN_HOST: lobby.r4b2.de
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in .env}
    restart: unless-stopped
    networks:
      default:
      # gvm's Caddy proxies wss://lobby.r4b2.de/ws to stellamortis-lobby:8080.
      gvm:
        aliases: [stellamortis-lobby]

  coturn:
    image: coturn/coturn:4.18.0
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    # Host networking: listens on 3478 TCP/UDP and relays on UDP 49160-49259 (turnserver.conf)
    # directly on the host's address, so relayed players can reach each other.
    network_mode: host
    restart: unless-stopped

networks:
  gvm:
    name: gvm_default
    external: true
