# coturn for a local test (docker-compose.local.yml): host networking, loopback only, relaying
# allowed to this machine so a forced relay can be tried end to end.
listening-ip=127.0.0.1
relay-ip=127.0.0.1
listening-port=3478
min-port=49160
max-port=49259
realm=localhost
use-auth-secret
fingerprint
no-tls
no-dtls
no-cli
allow-loopback-peers
log-file=stdout
